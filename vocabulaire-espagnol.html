<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Mon Jeu de Vocabulaire Espagnol — Sequencia 2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: #333;
  }
  h1 { color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,.3); margin-bottom: 5px; font-size: 1.6em; text-align: center; }
  .subtitle { color: #f0e9ff; margin-bottom: 20px; font-style: italic; text-align: center; }
  .panel {
    background: #fff; border-radius: 20px; padding: 25px;
    box-shadow: 0 15px 35px rgba(0,0,0,.25);
    width: 100%; max-width: 700px; margin-bottom: 20px;
  }
  .modes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
  .mode-btn {
    padding: 12px 18px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 1em; font-weight: bold; background: rgba(255,255,255,.25);
    color: #fff; transition: all .2s;
  }
  .mode-btn:hover { background: rgba(255,255,255,.4); transform: translateY(-2px); }
  .mode-btn.active { background: #ffd93d; color: #6b3410; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .hud { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
  .badge { background: #f0f0ff; padding: 8px 14px; border-radius: 999px; font-weight: bold; }
  .badge.score { background: #d4f7d4; }
  .badge.streak { background: #ffeed4; }
  .hidden { display: none !important; }

  /* Flashcards */
  .flashcard {
    background: linear-gradient(135deg, #ff9a56, #ff6b95);
    color: #fff; border-radius: 18px; min-height: 180px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-size: 2em; font-weight: bold; cursor: pointer; text-align: center;
    padding: 30px; user-select: none; transition: transform .3s;
    text-shadow: 1px 1px 3px rgba(0,0,0,.2);
  }
  .flashcard:hover { transform: scale(1.02); }
  .flashcard .trad { font-size: .55em; margin-top: 15px; opacity: .95; }
  .fc-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }

  .big-btn {
    padding: 14px 24px; border: none; border-radius: 12px; font-size: 1.05em;
    font-weight: bold; cursor: pointer; transition: all .2s;
  }
  .btn-green { background: #4caf50; color: #fff; }
  .btn-blue { background: #2196f3; color: #fff; }
  .btn-next { background: #ffd93d; }
  .big-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }

  /* Quiz */
  .question-word {
    background: #fff3e0; border-radius: 15px; padding: 30px; text-align: center;
    font-size: 1.9em; font-weight: bold; margin-bottom: 20px; min-height: 100px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .question-word .dir { font-size: .45em; color: #c60; margin-bottom: 8px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .choices { grid-template-columns: 1fr; } }
  .choice {
    padding: 18px; border-radius: 12px; border: 3px solid #e0e0ff;
    background: #fafaff; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: all .15s;
  }
  .choice:hover { border-color: #764ba2; background: #f4efff; }
  .choice.correct { background: #c8f7c8; border-color: #4caf50; }
  .choice.wrong { background: #ffd6d6; border-color: #e53935; }

  /* Typing */
  .input-word {
    width: 100%; padding: 16px; font-size: 1.3em; border-radius: 12px;
    border: 3px solid #e0e0ff; text-align: center; outline: none;
  }
  .input-word:focus { border-color: #764ba2; }
  .typing-feedback { min-height: 30px; margin-top: 12px; font-weight: bold; font-size: 1.1em; }
  .ok { color: #2e7d32; } .ko { color: #c62828; }

  /* Memory */
  .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 560px) { .memory-grid { grid-template-columns: repeat(3, 1fr); } }
  .mem-card {
    aspect-ratio: 4/3; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: bold; font-size: .8em; padding: 8px; color: #fff;
    background: linear-gradient(135deg, #667eea, #764ba2);
    transition: all .25s; word-break: break-word;
  }
  .mem-card:hover { transform: scale(1.04); }
  .mem-card.flipped { background: #fff; color: #333; border: 3px solid #764ba2; }
  .mem-card.matched { background: #c8f7c8; color: #2e7d32; border: 3px solid #4caf50;
    cursor: default; transform: none; opacity: .8; }

  .progress-bar { background: #eee; border-radius: 999px; height: 12px; overflow: hidden; margin-top: 15px; }
  .progress-fill { background: linear-gradient(90deg, #4caf50, #8bc34a); height: 100%; width: 0%; transition: width .4s; }

  .end-msg { text-align: center; font-size: 1.3em; font-weight: bold; padding: 20px; }
  .restart-zone { text-align: center; margin-top: 15px; }
  .hint { text-align: center; color: #888; font-size: .9em; margin-top: 12px; }
</style>
</head>
<body>
  <h1>🎮 Mon Jeu de Vocabulaire Espagnol</h1>
  <p class="subtitle">📖 Sequencia 2 — el español 🇪🇸</p>

  <div class="panel">
    <div class="modes">
      <button class="mode-btn active" data-mode="flash">🃏 Cartes mémoire</button>
      <button class="mode-btn" data-mode="quiz">❓ QCM</button>
      <button class="mode-btn" data-mode="typing">⌨️ Écriture</button>
      <button class="mode-btn" data-mode="memory">🧩 Paires</button>
    </div>
    <div class="hud">
      <span class="badge score">⭐ Score : <span id="score">0</span></span>
      <span class="badge streak">🔥 Série : <span id="streak">0</span></span>
      <span class="badge">📊 <span id="progressTxt">0 / 0</span></span>
    </div>
    <div id="gameZone"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

<script>
const VOCAB = [
  { es: "arriba", fr: "en haut" },
  { es: "abajo", fr: "en bas" },
  { es: "a la derecha", fr: "à droite" },
  { es: "a la izquierda", fr: "à gauche" },
  { es: "tocar", fr: "jouer d'un instrument" },
  { es: "subir", fr: "monter" },
  { es: "llevar", fr: "porter" },
  { es: "un torero", fr: "un toréador" },
  { es: "un toro", fr: "un taureau" },
  { es: "la arena blanca", fr: "le sable blanc" },
  { es: "la sangre", fr: "le sang" },
  { es: "pelear", fr: "combattre / se battre" },
  { es: "el turismo de sol y playa", fr: "le tourisme balnéaire" },
  { es: "compartir", fr: "partager" },
  { es: "relajarse", fr: "se détendre" },
  { es: "pasear / caminar", fr: "se promener / marcher" },
  { es: "el turismo gastronómico", fr: "le tourisme gastronomique" },
  { es: "tomar una copa", fr: "prendre un verre" },
  { es: "las tradiciones", fr: "les traditions" },
  { es: "las costumbres", fr: "les coutumes" },
  { es: "la vida local", fr: "la vie locale" },
  { es: "pueblos rodeados de naturaleza", fr: "villages entourés de nature" },
  { es: "buscar tranquilidad", fr: "chercher la tranquillité" },
  { es: "el senderismo", fr: "la randonnée" },
  { es: "disfrutar de", fr: "profiter de" },
  { es: "comprar", fr: "acheter" },
  { es: "tomar el sol", fr: "prendre le soleil" },
  { es: "hacer deportes acuáticos", fr: "faire des sports aquatiques" },
  { es: "probar", fr: "essayer / goûter" },
  { es: "los platos típicos", fr: "les plats typiques" },
  { es: "la comida local", fr: "la nourriture locale" },
  { es: "descubrir / conocer", fr: "découvrir" },
  { es: "nuevos sabores", fr: "nouvelles saveurs" },
  { es: "poner", fr: "mettre" },
  { es: "la mochila", fr: "le sac à dos" },
  { es: "siempre", fr: "toujours" },
  { es: "apenas", fr: "à peine" },
  { es: "aquella", fr: "celle-là" },
  { es: "ocio o negocios", fr: "loisirs et affaires" },
  { es: "pernoctar", fr: "passer la nuit" },
  { es: "tantas", fr: "tant de" },
  { es: "centrarse en", fr: "se concentrer sur" },
  { es: "de cada una de ellas", fr: "de chacune d'entre elles" },
  { es: "descansar", fr: "se reposer" },
  { es: "escoger", fr: "choisir" },
  { es: "emprender", fr: "entreprendre" },
  { es: "cómodo", fr: "commode / confortable" },
  { es: "la tranquilidad", fr: "la tranquillité" }
];

let score = 0, streak = 0, mode = "flash";
const $ = id => document.getElementById(id);
const shuffle = a => a.slice().sort(() => Math.random() - .5);
const norm = s => s.toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
const pick = a => a[Math.floor(Math.random() * a.length)];

function updateHUD(done, total) {
  $("score").textContent = score;
  $("streak").textContent = streak;
  $("progressTxt").textContent = done + " / " + total;
  $("progressFill").style.width = (total ? done / total * 100 : 0) + "%";
}
function addPoint() { score += 10 + streak * 2; streak++; }
function loseStreak() { streak = 0; updateHUD(0, 0); }

/* ---------- FLASHCARDS ---------- */
let fcDeck = [], fcIndex = 0, fcFlipped = false;
function startFlash() {
  fcDeck = shuffle(VOCAB); fcIndex = 0;
  renderFlash();
}
function renderFlash() {
  updateHUD(fcIndex, fcDeck.length);
  if (fcIndex >= fcDeck.length) { endZone("cartes"); return; }
  const w = fcDeck[fcIndex];
  fcFlipped = false;
  $("gameZone").innerHTML = `
    <div class="flashcard" id="fcCard"><span>${w.es}</span></div>
    <div class="fc-buttons">
      <button class="big-btn btn-blue" id="fcPrev">⬅️ Avant</button>
      <button class="big-btn btn-green" id="fcNext">Suivant ➡️</button>
    </div>
    <p class="hint">💡 Clique sur la carte pour voir la traduction ! (${fcIndex + 1}/${fcDeck.length})</p>`;
  $("fcCard").onclick = () => {
    fcFlipped = !fcFlipped;
    $("fcCard").innerHTML = fcFlipped
      ? `<span>${w.fr}</span>`
      : `<span>${w.es}</span>`;
  };
  $("fcNext").onclick = () => { fcIndex++; if (streak >= 0) streak = mode === "flash" ? streak : streak; renderFlash(); };
  $("fcPrev").onclick = () => { if (fcIndex > 0) fcIndex--; renderFlash(); };
}

/* ---------- QUIZ ---------- */
let quizList = [], quizIndex = 0, quizLocked = false;
function startQuiz() {
  quizList = shuffle(VOCAB); quizIndex = 0;
  renderQuiz();
}
function renderQuiz() {
  updateHUD(quizIndex, quizList.length);
  if (quizIndex >= quizList.length) { endZone("QCM"); return; }
  const w = quizList[quizIndex];
  const toFr = Math.random() < .5;
  const question = toFr ? w.es : w.fr;
  const answer = toFr ? w.fr : w.es;
  const others = shuffle(VOCAB).filter(x => x !== w).slice(0, 3)
    .map(x => toFr ? x.fr : x.es);
  const choices = shuffle([answer, ...others]);
  quizLocked = false;
  $("gameZone").innerHTML = `
    <div class="question-word">
      <div class="dir">${toFr ? "🇪🇸 → 🇫🇷 Que veut dire ce mot ?" : "🇫🇷 → 🇪🇸 Comment dit-on en espagnol ?"}</div>
      ${question}
    </div>
    <div class="choices" id="choices"></div>`;
  const zone = $("choices");
  choices.forEach(c => {
    const b = document.createElement("button");
    b.className = "choice"; b.textContent = c;
    b.onclick = () => {
      if (quizLocked) return;
      quizLocked = true;
      if (norm(c) === norm(answer)) { b.classList.add("correct"); addPoint(); }
      else {
        b.classList.add("wrong"); loseStreak();
        [...zone.children].forEach(x => { if (norm(x.textContent) === norm(answer)) x.classList.add("correct"); });
      }
      updateHUD(quizIndex, quizList.length);
      setTimeout(() => { quizIndex++; renderQuiz(); }, 900);
    };
    zone.appendChild(b);
  });
}

/* ---------- TYPING ---------- */
let typeList = [], typeIndex = 0;
function startTyping() {
  typeList = shuffle(VOCAB); typeIndex = 0;
  renderTyping();
}
function renderTyping() {
  updateHUD(typeIndex, typeList.length);
  if (typeIndex >= typeList.length) { endZone("écriture"); return; }
  const w = typeList[typeIndex];
  const toFr = Math.random() < .5;
  const prompt = toFr ? w.es : w.fr;
  const answer = toFr ? w.fr : w.es;
  window.__typeAnswer = answer;
  $("gameZone").innerHTML = `
    <div class="question-word">
      <div class="dir">${toFr ? "🇪🇸 → 🇫🇷 Écris en français :" : "🇫🇷 → 🇪🇸 Écris en espagnol :"}</div>
      ${prompt}
    </div>
    <input class="input-word" id="typeInput" placeholder="Ta réponse ici..." autocomplete="off" autofocus>
    <div class="typing-feedback" id="typeFb"></div>
    <div class="restart-zone"><button class="big-btn btn-blue" id="typeCheck">✅ Vérifier (Entrée)</button></div>`;
  const inp = $("typeInput");
  inp.focus();
  const check = () => {
    const val = inp.value;
    if (!val.trim()) return;
    const alt = window.__typeAnswer.split("/").map(s => s.trim()).filter(Boolean);
    alt.push(window.__typeAnswer);
    if (alt.some(a => norm(a) === norm(val))) {
      $("typeFb").innerHTML = `<span class="ok">🎉 Bravo !</span>`;
      addPoint();
    } else {
      $("typeFb").innerHTML = `<span class="ko">❌ La réponse était : <u>${window.__typeAnswer}</u></span>`;
      loseStreak();
    }
    updateHUD(typeIndex, typeList.length);
    inp.disabled = true;
    setTimeout(() => { typeIndex++; renderTyping(); }, 1100);
  };
  $("typeCheck").onclick = check;
  inp.onkeydown = e => { if (e.key === "Enter") check(); };
}

/* ---------- MEMORY ---------- */
let memPick = [], memLock = false, memMatches = 0, memTotalPairs = 0;
function startMemory() {
  const pairs = shuffle(VOCAB).slice(0, 8);
  const cards = shuffle(pairs.flatMap(p => [
    { text: p.es, pair: p.es }, { text: p.fr, pair: p.es }
  ]));
  memPick = []; memLock = false; memMatches = 0; memTotalPairs = pairs.length;
  window.__memCards = cards;
  renderMemory();
}
function renderMemory() {
  updateHUD(memMatches, memTotalPairs);
  if (memMatches >= memTotalPairs) { endZone("paires"); return; }
  const cards = window.__memCards;
  $("gameZone").innerHTML = `<div class="memory-grid" id="memGrid"></div>
    <p class="hint">🧩 Trouve les paires espagnol ↔️ français !</p>`;
  const grid = $("memGrid"), state = cards.map(() => false), done = cards.map(() => false);
  cards.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "mem-card"; d.textContent = "?";
    d.onclick = () => {
      if (memLock || done[i] || state[i]) return;
      state[i] = true; d.classList.add("flipped"); d.textContent = c.text;
      memPick.push({ i, c, d });
      if (memPick.length === 2) {
        memLock = true;
        const [a, b] = memPick;
        if (a.c.pair === b.c.pair && a.i !== b.i) {
          a.d.classList.add("matched"); b.d.classList.add("matched");
          done[a.i] = done[b.i] = true;
          memMatches++; addPoint(); memPick = []; memLock = false;
          updateHUD(memMatches, memTotalPairs);
          if (memMatches >= memTotalPairs) setTimeout(() => endZone("paires"), 600);
        } else {
          loseStreak();
          setTimeout(() => {
            a.d.classList.remove("flipped"); b.d.classList.remove("flipped");
            a.d.textContent = "?"; b.d.textContent = "?";
            state[a.i] = state[b.i] = false;
            memPick = []; memLock = false;
          }, 800);
        }
      }
    };
    grid.appendChild(d);
  });
}

/* ---------- END ---------- */
function endZone(label) {
  updateHUD(0, 0);
  $("gameZone").innerHTML = `
    <div class="end-msg">
      ${score > 0 ? "🏆 Bravo, tu as fini les " + label + " !" : "✅ Terminé !"}
      <br>⭐ Score actuel : <span style="color:#e65100">${score}</span>
      <br><br><button class="big-btn btn-green" id="againBtn">🔁 Recommencer</button>
    </div>`;
  $("againBtn").onclick = startMode;
}

/* ---------- MODE SWITCH ---------- */
function startMode() {
  $("gameZone").innerHTML = "";
  if (mode === "flash") startFlash();
  else if (mode === "quiz") startQuiz();
  else if (mode === "typing") startTyping();
  else startMemory();
}
document.querySelectorAll(".mode-btn").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".mode-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    mode = b.dataset.mode;
    startMode();
  };
});
startMode();
</script>
</body>
</html>
